name: Backend CI

on:
  push:
    branches: [main, "dohoudaniel/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type-check
        run: mypy apps/common

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage gate (85% overall)
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

      - name: Money module coverage gate (100%)
        # Any code path that can change what a customer is charged is fully
        # covered, or it does not merge. See docs/TESTING.md §1.
        run: pytest apps/common/tests/test_money.py --cov=apps.common.money --cov-fail-under=100

      - name: Deployment check
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
          ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

  security:
    name: Security gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PCI card-field gate
        # Raw cardholder data must never reach our infrastructure.
        # See backend/docs/PAYMENTS.md §1.1.
        run: ./scripts/check-no-card-fields.sh

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --strict --desc || pip-audit --desc

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
