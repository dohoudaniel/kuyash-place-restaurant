name: Backend CI

on:
  push:
    branches: [main, "dohoudaniel/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type-check
        # Paths come from pyproject.toml; naming them here would bypass `exclude`.
        run: mypy

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage gate (85% overall)
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

      - name: Money module coverage gate (100%)
        # Any code path that can change what a customer is charged is fully
        # covered, or it does not merge. See docs/TESTING.md §1.
        run: pytest apps/common/tests/test_money.py --cov=apps.common.money --cov-fail-under=100

      - name: Money-path coverage gate (100%)
        # Pricing, promo rules, order services, payment services, the provider
        # adapters, loyalty rewards and paid enrolments decide what is charged,
        # discounted and refunded, so they carry the same requirement as the
        # money primitives. The loyalty and academy suites run too: they are
        # what exercises the reward and enrolment branches of pricing and payments.
        run: |
          pytest apps/carts apps/promotions apps/orders apps/payments \
            apps/loyalty apps/academy \
            --cov=apps.carts.services --cov=apps.promotions.services \
            --cov=apps.orders.services --cov=apps.payments.services \
            --cov=apps.payments.tasks --cov=apps.payments.providers \
            --cov=apps.loyalty.services --cov=apps.academy.services \
            --cov-fail-under=100

      - name: Deployment check
        # A production-shaped environment. prod.py refuses to import without a
        # payment key, and the project checks warn on a default admin path, a
        # missing cookie domain, test payment keys and a non-https callback — so
        # every one is set here the way a real deploy must set it. Values are
        # placeholders; nothing here can take money or reach a real service.
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-but-long-enough-for-the-deploy-check-0123456789
          ALLOWED_HOSTS: api.example.com
          DATABASE_URL: sqlite:///ci-deploy-check.sqlite3
          REDIS_URL: redis://localhost:6379/0
          PAYSTACK_SECRET_KEY: sk_live_ci_placeholder
          ADMIN_URL: ci-staff-console-7f3a/
          TRUSTED_PROXY_COUNT: "1"
          SESSION_COOKIE_DOMAIN: .example.com
          FRONTEND_URL: https://example.com
          PAYMENT_CALLBACK_URL: https://example.com/checkout/complete
          ACADEMY_PAYMENT_CALLBACK_URL: https://example.com/academy/enrolment/complete
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

  postgres:
    name: Tests against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuyash
          POSTGRES_PASSWORD: kuyash
          POSTGRES_DB: kuyash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite against Postgres
        # Local development runs on SQLite (ADR-015), which has no row-level
        # locking and no full-text search. The concurrency tests and the
        # Postgres-only query paths are skipped there and must run here, or the
        # skip is just a hole in the suite.
        env:
          DATABASE_URL: postgres://kuyash:kuyash@localhost:5432/kuyash_test
        run: pytest -q --no-header

      - name: Confirm no test was skipped for lack of Postgres
        # Generic on purpose: any test gated behind `requires_postgres` must run
        # here. Checking specific files would let a newly added one slip through
        # silently, which is how a skip becomes a hole.
        env:
          DATABASE_URL: postgres://kuyash:kuyash@localhost:5432/kuyash_test
        run: |
          output=$(pytest -q --no-header -rs)
          echo "$output"
          if echo "$output" | grep -q "SQLite locks the whole table"; then
            echo "::error::Postgres-gated tests were skipped on the Postgres job."
            exit 1
          fi

  security:
    name: Security gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PCI card-field gate (frontend)
        # Raw cardholder data must never reach our infrastructure. The backend
        # half of this gate is an AST check in the test suite
        # (apps/payments/tests/test_no_card_data.py), which runs in the quality
        # job. See backend/docs/PAYMENTS.md §1.1.
        run: ./scripts/check-no-card-fields.sh

      - name: Money gate (frontend)
        # The server prices everything; components render Money.display. Fails on
        # arithmetic on `.amount`, Intl currency formatting or hand-built naira
        # strings. See backend/docs/FRONTEND_INTEGRATION.md §6.
        run: ./scripts/check-no-price-arithmetic.sh

      - name: No alert() gate (frontend)
        # PRD §9 criterion 11: forms show the API's result in the page, never a
        # native browser dialog standing in for a real submission.
        run: ./scripts/check-no-alert.sh

      - name: Dependency audit (backend)
        # Audits the project's installed dependencies, not the runner's bare
        # Python, and fails on any known vulnerability. SECURITY.md §8.
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
          pip-audit --strict --desc --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependency audit (frontend)
        # Reads the lockfile only; nothing is installed. Fails on high or critical.
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
