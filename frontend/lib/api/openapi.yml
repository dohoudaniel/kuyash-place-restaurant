  /api/v1/wishlist/sync/:
    post:
      operationId: wishlist_sync_create
      description: |-
        Merge a browser's saved list into the account.

        Additive by design: signing in should never lose something the customer
        saved, on either side. Unknown or withdrawn slugs are reported rather than
        silently dropped, because the frontend's list is keyed on an image filename
        and will contain stale entries.
      summary: Merge a local wishlist
      tags:
      - wishlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncWishlistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncWishlistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncWishlistRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: ''
  /api/v1/wishlist/{slug}/:
    delete:
      operationId: wishlist_destroy
      description: Remove one saved dish.
      summary: Remove a saved dish
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - wishlist
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
          description: ''
  /api/v1/webhooks/paystack/:
    post:
      operationId: webhooks_paystack_create
      description: |-
        Provider webhooks.

        Unauthenticated by design (WH-5): the signature is the authentication.
        CSRF is exempt because the caller is a server, not a browser session.
      summary: Payment webhook
      tags:
      - payments
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
  /api/v1/webhooks/flutterwave/:
    post:
      operationId: webhooks_flutterwave_create
      description: |-
        Provider webhooks.

        Unauthenticated by design (WH-5): the signature is the authentication.
        CSRF is exempt because the caller is a server, not a browser session.
      summary: Payment webhook
      tags:
      - payments
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
  /api/v1/accounts/me/:
    get:
      operationId: accounts_me_retrieve
