        failed:
          type: integer
        average_delivery_minutes:
          type: number
          format: double
          nullable: true
        on_time_percent:
          type: integer
          nullable: true
        cash_collected:
          $ref: '#/components/schemas/Money'
      required:
      - average_delivery_minutes
      - cash_collected
      - deliveries
      - failed
      - on_time_percent
      - rider
    RiderReport:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        riders:
          type: array
          items:
            $ref: '#/components/schemas/RiderPerformance'
      required:
      - period
      - riders
    SalesBucket:
      type: object
      properties:
        orders:
          type: integer
        gross:
          $ref: '#/components/schemas/Money'
      required:
      - gross
      - orders
    SalesReport:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        orders:
          type: integer
        gross:
          $ref: '#/components/schemas/Money'
        refunds:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        average_order:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
        discounts:
          $ref: '#/components/schemas/Money'
        delivery_fees:
          $ref: '#/components/schemas/Money'
        service_charges:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
        tips:
          $ref: '#/components/schemas/Money'
        average_prep_minutes:
          type: number
          format: double
          nullable: true
        by_payment_method:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SalesBucket'
        by_fulfilment:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SalesBucket'
        incomplete_orders:
          type: object
          additionalProperties:
            type: integer
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailySales'
      required:
      - average_order
      - average_prep_minutes
      - by_fulfilment
      - by_payment_method
      - daily
      - delivery_fees
      - discounts
      - gross
      - incomplete_orders
      - net
      - orders
      - period
      - refunds
      - service_charges
      - subtotal
      - tips
      - vat
    SavedPaymentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/SavedPaymentMethodProviderEnum'
          readOnly: true
        card_label:
          type: string
          readOnly: true
        card_brand:
          type: string
          readOnly: true
        card_last4:
          type: string
          readOnly: true
        card_exp_month:
          type: string
          readOnly: true
        card_exp_year:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        is_expired:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - card_brand
      - card_exp_month
      - card_exp_year
      - card_label
      - card_last4
      - created_at
      - id
      - is_default
      - is_expired
      - last_used_at
      - provider
    SavedPaymentMethodProviderEnum:
      enum:
      - paystack
      - flutterwave
      - bank_transfer
      - cash
      type: string
      description: |-
        * `paystack` - Paystack
        * `flutterwave` - Flutterwave
        * `bank_transfer` - Bank transfer
        * `cash` - Cash
    ServiceEnum:
      enum:
      - all_day
      - breakfast
      - lunch
      - dinner
      type: string
      description: |-
        * `all_day` - All day
        * `breakfast` - Breakfast
        * `lunch` - Lunch
        * `dinner` - Dinner
    Session:
      type: object
      description: 'Envelope so an anonymous visitor gets ``{"user": null}`` rather
        than a 401.'
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/CurrentUser'
          nullable: true
      required:
      - user
    SiteSettings:
      type: object
      description: |-
        What `/core/settings/` publishes to anyone who asks.

        An explicit allowlist, not ``exclude``. With ``exclude`` this endpoint served
        ``support_email`` and ``orders_email`` — the internal mailboxes alerts are
        delivered to — unauthenticated, and every field added to the model later
        would have been published automatically by the same omission. Adding a field
        to this list is now a deliberate act.
      properties:
        site_name:
          type: string
          readOnly: true
        tagline:
          type: string
          readOnly: true
        meta_description:
          type: string
          readOnly: true
        instagram_url:
          type: string
          format: uri
          readOnly: true
        facebook_url:
          type: string
          format: uri
          readOnly: true
        twitter_url:
          type: string
          format: uri
          readOnly: true
        tiktok_url:
          type: string
          format: uri
          readOnly: true
        established_year:
          type: integer
          readOnly: true
          nullable: true
          description: Shown on the About page. Leave blank to hide it.
        stat_customers:
          type: string
          readOnly: true
        stat_dishes:
          type: string
          readOnly: true
        stat_years:
          type: string
          readOnly: true
        stat_rating:
          type: string
          readOnly: true
      required:
      - established_year
      - facebook_url
      - instagram_url
      - meta_description
      - site_name
      - stat_customers
      - stat_dishes
      - stat_rating
      - stat_years
      - tagline
      - tiktok_url
      - twitter_url
    SyncWishlistRequest:
      type: object
      description: Folds a browser's saved list into the account on first sign-in.
      properties:
        menu_items:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[-a-zA-Z0-9_]+$
          maxItems: 200
      required:
      - menu_items
    TableArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        features:
          readOnly: true
          description: e.g. ["Air conditioned", "Ambient music"]
        is_premium:
          type: boolean
          readOnly: true
        surcharge:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
      required:
      - description
      - features
      - id
      - is_premium
      - name
      - slug
      - surcharge
    TaxClassEnum:
      enum:
      - standard
      - zero_rated
      - exempt
      type: string
      description: |-
        * `standard` - Standard rated
        * `zero_rated` - Zero rated
        * `exempt` - Exempt
    TeamMember:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        photo_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - bio
      - name
      - photo_url
      - role
    Ticket:
      type: object
      properties:
        reference:
          type: string
          readOnly: true
        subject:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/TicketReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        requester_email:
          type: string
          format: email
          readOnly: true
        replies:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Internal notes are never exposed.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - reason
      - reference
      - replies
      - requester_email
      - requester_name
      - status
      - status_display
      - subject
    TicketReasonEnum:
      enum:
      - general
      - reservation
      - catering
      - feedback
      - partnership
      type: string
      description: |-
        * `general` - General
        * `reservation` - Reservation
        * `catering` - Catering
        * `feedback` - Feedback
        * `partnership` - Partnership
    TicketStatusEnum:
      enum:
      - open
      - pending
      - resolved
      - closed
      type: string
      description: |-
        * `open` - Open
        * `pending` - Awaiting customer
        * `resolved` - Resolved
        * `closed` - Closed
    Tier:
      type: object
      properties:
        name:
          type: string
          readOnly: true
        min_points:
          type: integer
          readOnly: true
          description: Lifetime points needed to reach this tier.
        multiplier:
          type: string
          readOnly: true
        earn_rate:
          type: string
          readOnly: true
        birthday_points:
          type: integer
          readOnly: true
          description: Points granted on the member's birthday. 0 = none.
        benefits:
          type: array
          items:
            type: string
          readOnly: true
        colour:
          type: string
          readOnly: true
      required:
      - benefits
      - birthday_points
      - colour
      - earn_rate
      - min_points
      - multiplier
      - name
    TodaysBook:
      type: object
      description: |-
        Response envelope for ``GET /reservations/book/``.

        Declared explicitly so the generated OpenAPI schema — and the frontend types
        generated from it — describe this endpoint instead of omitting it.
      properties:
        date:
          type: string
          format: date
        covers:
          type: integer
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/BookedReservation'
      required:
      - covers
      - date
      - reservations
    Totals:
      type: object
      description: |-
        The money breakdown shared by carts and orders.

        Declared so the generated schema types every line as money instead of an
        untyped dictionary — the frontend renders each ``display`` and has nothing
        to add up.
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        delivery_fee:
          $ref: '#/components/schemas/Money'
        service_charge:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
        tip:
          $ref: '#/components/schemas/Money'
        grand_total:
          $ref: '#/components/schemas/Money'
      required:
      - delivery_fee
      - discount
      - grand_total
      - service_charge
      - subtotal
      - tip
      - vat
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        price_delta:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
        is_default:
          type: boolean
      required:
      - id
      - name
      - price_delta
    VerifyEmailRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
      required:
      - key
    WebhookAck:
      type: object
      description: Providers only need an acknowledgement.
      properties:
        detail:
          type: string
      required:
      - detail
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    Wishlist:
      type: object
      properties:
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemList'
      required:
      - count
      - items
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kuyash_session
