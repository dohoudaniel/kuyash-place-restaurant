        ``replace`` is opt-in, and the endpoint answers 409 without it when the
        basket is not empty: a reorder that quietly discarded what the customer had
        already chosen would be destroying their work to save them a tap.
      properties:
        replace:
          type: boolean
          default: false
    ReorderResponse:
      type: object
      description: Response envelope for ``POST /orders/{reference}/reorder/``.
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        added:
          type: integer
        replaced_lines:
          type: integer
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ReorderChange'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/ReorderUnavailable'
        message:
          type: string
      required:
      - added
      - cart
      - changes
      - replaced_lines
      - unavailable
    ReorderUnavailable:
      type: object
      properties:
        item:
          type: string
        name:
          type: string
        reason:
          type: string
      required:
      - item
      - name
      - reason
    Reservation:
      type: object
      description: A booking as the customer sees it.
      properties:
        reference:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        area:
          allOf:
          - $ref: '#/components/schemas/TableArea'
          readOnly: true
        table_number:
          type: string
          readOnly: true
        reserved_for:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        party_size:
          type: integer
          readOnly: true
        guest_name:
          type: string
          readOnly: true
        guest_email:
          type: string
          format: email
          readOnly: true
        guest_phone:
          type: string
          readOnly: true
        special_requests:
          type: string
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - can_cancel
      - created_at
      - duration_minutes
      - ends_at
      - guest_email
      - guest_name
      - guest_phone
      - party_size
      - reference
      - reserved_for
      - special_requests
      - status
      - status_display
      - table_number
    ReservationAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        party_size:
          type: integer
        area:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSlot'
      required:
      - area
      - date
      - party_size
      - slots
    ReservationSlot:
      type: object
      properties:
        time:
          type: string
        available:
          type: boolean
        tables_left:
          type: integer
        reason:
          type: string
      required:
      - available
      - tables_left
      - time
    ReservationStatusEnum:
      enum:
      - pending
      - confirmed
      - seated
      - completed
      - cancelled
      - no_show
      type: string
      description: |-
        * `pending` - Pending confirmation
        * `confirmed` - Confirmed
        * `seated` - Seated
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `no_show` - No show
    Review:
      type: object
      description: A published review, as anyone sees it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        rating:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        comment:
          type: string
          readOnly: true
        recommends:
          type: boolean
          readOnly: true
        author_name:
          type: string
          readOnly: true
        is_verified_purchase:
          type: boolean
          readOnly: true
        helpful_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_name
      - comment
      - created_at
      - helpful_count
      - id
      - is_verified_purchase
      - rating
      - recommends
      - title
    ReviewCreateRequest:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        comment:
          type: string
          minLength: 1
          maxLength: 1000
        recommends:
          type: boolean
          default: true
        order_line:
          type: string
          format: uuid
          description: The `id` of a line on one of your delivered orders.
      required:
      - comment
      - order_line
      - rating
      - title
    ReviewHelpful:
      type: object
      properties:
        helpful_count:
          type: integer
        counted:
          type: boolean
          description: False when this voter had already voted.
      required:
      - counted
      - helpful_count
    ReviewItem:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - name
      - slug
    ReviewStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Awaiting moderation
        * `approved` - Published
        * `rejected` - Not published
    RiderAssignment:
      type: object
      properties:
        order:
          type: string
        rider:
          type: object
          additionalProperties: {}
        assigned_at:
          type: string
          format: date-time
      required:
      - assigned_at
      - order
      - rider
    SavedPaymentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/SavedPaymentMethodProviderEnum'
          readOnly: true
        card_label:
          type: string
          readOnly: true
        card_brand:
          type: string
          readOnly: true
        card_last4:
          type: string
          readOnly: true
        card_exp_month:
          type: string
          readOnly: true
        card_exp_year:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        is_expired:
          type: boolean
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - card_brand
      - card_exp_month
      - card_exp_year
      - card_label
      - card_last4
      - created_at
      - id
      - is_default
      - is_expired
      - last_used_at
      - provider
    SavedPaymentMethodProviderEnum:
      enum:
      - paystack
      - flutterwave
      - bank_transfer
      - cash
      type: string
      description: |-
        * `paystack` - Paystack
        * `flutterwave` - Flutterwave
        * `bank_transfer` - Bank transfer
        * `cash` - Cash
    ServiceEnum:
      enum:
      - all_day
      - breakfast
      - lunch
      - dinner
      type: string
      description: |-
        * `all_day` - All day
        * `breakfast` - Breakfast
        * `lunch` - Lunch
        * `dinner` - Dinner
    Session:
      type: object
      description: 'Envelope so an anonymous visitor gets ``{"user": null}`` rather
        than a 401.'
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/CurrentUser'
          nullable: true
      required:
      - user
    SiteSettings:
      type: object
      properties:
        site_name:
          type: string
          maxLength: 120
        tagline:
          type: string
          maxLength: 200
        meta_description:
          type: string
        instagram_url:
          type: string
          format: uri
          maxLength: 200
        facebook_url:
          type: string
          format: uri
          maxLength: 200
        twitter_url:
          type: string
          format: uri
          maxLength: 200
        tiktok_url:
          type: string
          format: uri
          maxLength: 200
        support_email:
          type: string
          format: email
          maxLength: 254
        orders_email:
          type: string
          format: email
          maxLength: 254
        stat_customers:
          type: string
          maxLength: 20
        stat_dishes:
          type: string
          maxLength: 20
        stat_years:
          type: string
          maxLength: 20
        stat_rating:
          type: string
          maxLength: 20
    SyncWishlistRequest:
      type: object
      description: Folds a browser's saved list into the account on first sign-in.
      properties:
        menu_items:
          type: array
          items:
            type: string
            minLength: 1
            pattern: ^[-a-zA-Z0-9_]+$
          maxItems: 200
      required:
      - menu_items
    TableArea:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        features:
          readOnly: true
          description: e.g. ["Air conditioned", "Ambient music"]
        is_premium:
          type: boolean
          readOnly: true
        surcharge:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
      required:
      - description
      - features
      - id
      - is_premium
      - name
      - slug
      - surcharge
    TaxClassEnum:
      enum:
      - standard
      - zero_rated
      - exempt
      type: string
      description: |-
        * `standard` - Standard rated
        * `zero_rated` - Zero rated
        * `exempt` - Exempt
    Ticket:
      type: object
      properties:
        reference:
          type: string
          readOnly: true
        subject:
          type: string
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/TicketReasonEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        requester_email:
          type: string
          format: email
          readOnly: true
        replies:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Internal notes are never exposed.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - reason
      - reference
      - replies
      - requester_email
      - requester_name
      - status
      - status_display
      - subject
    TicketReasonEnum:
      enum:
      - general
      - reservation
      - catering
      - feedback
      - partnership
      type: string
      description: |-
        * `general` - General
        * `reservation` - Reservation
        * `catering` - Catering
        * `feedback` - Feedback
        * `partnership` - Partnership
    TicketStatusEnum:
      enum:
      - open
      - pending
      - resolved
      - closed
      type: string
      description: |-
        * `open` - Open
        * `pending` - Awaiting customer
        * `resolved` - Resolved
        * `closed` - Closed
    TodaysBook:
      type: object
      description: |-
        Response envelope for ``GET /reservations/book/``.

        Declared explicitly so the generated OpenAPI schema — and the frontend types
        generated from it — describe this endpoint instead of omitting it.
      properties:
        date:
          type: string
          format: date
        covers:
          type: integer
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/BookedReservation'
      required:
      - covers
      - date
      - reservations
    Totals:
      type: object
      description: |-
        The money breakdown shared by carts and orders.

        Declared so the generated schema types every line as money instead of an
        untyped dictionary — the frontend renders each ``display`` and has nothing
        to add up.
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        delivery_fee:
          $ref: '#/components/schemas/Money'
        service_charge:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
        tip:
          $ref: '#/components/schemas/Money'
        grand_total:
          $ref: '#/components/schemas/Money'
      required:
      - delivery_fee
      - discount
      - grand_total
      - service_charge
      - subtotal
      - tip
      - vat
    TypeEnum:
      enum:
      - price_increased
      - price_reduced
      - options_removed
      type: string
      description: |-
        * `price_increased` - price_increased
        * `price_reduced` - price_reduced
        * `options_removed` - options_removed
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        price_delta:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
        is_default:
          type: boolean
      required:
      - id
      - name
      - price_delta
    VerifyEmailRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
      required:
      - key
    WebhookAck:
      type: object
      description: Providers only need an acknowledgement.
      properties:
        detail:
          type: string
      required:
      - detail
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    Wishlist:
      type: object
      properties:
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemList'
      required:
      - count
      - items
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kuyash_session
