        name:
          type: string
      required:
      - name
      - slug
    RewardTypeEnum:
      enum:
      - discount
      - free_delivery
      - free_item
      type: string
      description: |-
        * `discount` - Money off
        * `free_delivery` - Free delivery
        * `free_item` - Free dish
    RiderAssignment:
      type: object
      properties:
        order:
          type: string
        rider:
