          - $ref: '#/components/schemas/RewardTypeEnum'
          readOnly: true
        reward_type_display:
          type: string
          readOnly: true
        value:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
          readOnly: true
        min_order_value:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
          readOnly: true
        menu_item:
