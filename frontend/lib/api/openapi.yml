      - in: header
        name: X-Chat-Token
        schema:
          type: string
        description: The token returned when the conversation started. Not needed
          by its signed-in owner.
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - support
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
