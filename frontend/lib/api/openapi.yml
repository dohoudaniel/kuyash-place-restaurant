components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - Approve
        * `reject` - Reject
    AddItemRequest:
      type: object
      description: Input for adding a line. Note the absence of any price field.
      properties:
        menu_item:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        quantity:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
        variant:
          type: string
          format: uuid
          nullable: true
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/ModifierChoiceRequest'
        special_instructions:
          type: string
          default: ''
          maxLength: 500
      required:
      - menu_item
    AddToWishlistRequest:
      type: object
      properties:
        menu_item:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - menu_item
    Address:
      type: object
      description: |-
        A saved address, with its resolved delivery zone.

        ``zone: null`` means the address falls outside the delivery area — the UI
        must offer pickup rather than letting the customer fail at checkout.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          $ref: '#/components/schemas/LabelEnum'
        recipient_name:
          type: string
          maxLength: 150
        phone:
          type: string
          pattern: ^\+?[1-9]\d{7,14}$
          maxLength: 20
        street:
          type: string
          maxLength: 255
        area:
          type: string
          description: District or neighbourhood, e.g. Victoria Island. Used to resolve
            the zone.
          maxLength: 120
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        landmark:
          type: string
          maxLength: 255
        delivery_notes:
          type: string
        is_default:
          type: boolean
        zone:
          allOf:
          - $ref: '#/components/schemas/DeliveryZone'
          readOnly: true
        is_deliverable:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - created_at
      - id
      - is_deliverable
      - phone
      - recipient_name
      - state
      - street
      - zone
    AddressRequest:
      type: object
      description: |-
        A saved address, with its resolved delivery zone.

        ``zone: null`` means the address falls outside the delivery area — the UI
        must offer pickup rather than letting the customer fail at checkout.
      properties:
        label:
          $ref: '#/components/schemas/LabelEnum'
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          pattern: ^\+?[1-9]\d{7,14}$
          maxLength: 20
        street:
          type: string
          minLength: 1
          maxLength: 255
        area:
          type: string
          description: District or neighbourhood, e.g. Victoria Island. Used to resolve
            the zone.
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        landmark:
          type: string
          maxLength: 255
        delivery_notes:
          type: string
        is_default:
          type: boolean
      required:
      - city
      - phone
      - recipient_name
      - state
      - street
    AuthUserResponse:
      type: object
      description: '``{"user": …}`` — returned by login and email verification.'
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
      required:
      - user
    BankTransferDetails:
      type: object
      properties:
        bank_name:
          type: string
        account_name:
          type: string
        account_number:
          type: string
      required:
      - account_name
      - account_number
      - bank_name
    BlankEnum:
      enum:
      - ''
    BookedReservation:
      type: object
      description: A reservation as it appears in the day's book, with local time
        added.
      properties:
        reference:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ReservationStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        area:
          allOf:
          - $ref: '#/components/schemas/TableArea'
          readOnly: true
        table_number:
          type: string
          readOnly: true
        reserved_for:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        party_size:
          type: integer
          readOnly: true
        guest_name:
          type: string
          readOnly: true
        guest_email:
          type: string
          format: email
          readOnly: true
        guest_phone:
          type: string
          readOnly: true
        special_requests:
          type: string
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        time:
          type: string
          readOnly: true
          description: Local HH:MM.
      required:
      - area
      - can_cancel
      - created_at
      - duration_minutes
      - ends_at
      - guest_email
      - guest_name
      - guest_phone
      - party_size
      - reference
      - reserved_for
      - special_requests
      - status
      - status_display
      - table_number
      - time
    Branch:
      type: object
      description: Everything the frontend needs to decide whether ordering is possible.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        phone:
          type: string
          readOnly: true
        whatsapp:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        address_line:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        timezone:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        prices_include_vat:
          type: boolean
          readOnly: true
          description: When on, menu prices are what the customer pays and VAT is
            extracted from them for accounting. When off, VAT is added at checkout.
            The published terms currently promise tax-inclusive pricing — see docs/PRD.md
            §7 before changing this.
        vat_rate_bps:
          type: integer
          readOnly: true
          description: Basis points. 750 = 7.5%. Integer, so the rate can never drift.
        service_charge_bps:
          type: integer
          readOnly: true
          description: Basis points applied to the order subtotal. 0 = none.
        is_accepting_orders:
          type: boolean
          readOnly: true
          description: Manual kill switch. Turn off to stop new orders during a rush.
        is_open_now:
          type: boolean
          readOnly: true
        can_accept_orders:
          type: boolean
          readOnly: true
        next_opens_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        min_order_value:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
        free_delivery_threshold:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
        default_prep_minutes:
          type: integer
          readOnly: true
          description: Fallback preparation time when a menu item has none.
        bank_transfer:
          allOf:
          - $ref: '#/components/schemas/BankTransferDetails'
          nullable: true
          readOnly: true
      required:
      - address_line
      - bank_transfer
      - can_accept_orders
      - city
      - currency
      - default_prep_minutes
      - email
      - free_delivery_threshold
      - id
      - is_accepting_orders
      - is_open_now
      - latitude
      - longitude
      - min_order_value
      - name
      - next_opens_at
      - phone
      - prices_include_vat
      - service_charge_bps
      - slug
      - state
      - timezone
      - vat_rate_bps
      - whatsapp
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 300
    CancelReservationRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 300
    Cart:
      type: object
      description: Documents the cart response shape for the generated schema.
      properties:
        id:
          type: string
          format: uuid
        fulfilment_type:
          type: string
        delivery_address:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
          description: Total quantity across lines, for badges.
        totals:
          $ref: '#/components/schemas/Totals'
        promo_code:
          type: string
        prices_include_vat:
          type: boolean
        vat_note:
          type: string
        delivery_note:
          type: string
        estimated_minutes:
          type: integer
          nullable: true
        changes:
          type: array
          items:
            $ref: '#/components/schemas/CartChange'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/CartUnavailable'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CartBlocker'
        can_checkout:
          type: boolean
      required:
      - blockers
      - can_checkout
      - changes
      - delivery_address
      - delivery_note
      - estimated_minutes
      - fulfilment_type
      - id
      - item_count
      - items
      - prices_include_vat
      - promo_code
      - totals
      - unavailable
      - vat_note
    CartBlocker:
      type: object
      properties:
        code:
          type: string
          description: address_required | outside_delivery_area | below_minimum_order
            | item_unavailable | cart_empty | branch_closed
        detail:
          type: string
      required:
      - code
      - detail
    CartChange:
      type: object
      properties:
        item:
          type: string
        name:
          type: string
        type:
          type: string
          description: price_increased | price_reduced
        old:
          $ref: '#/components/schemas/PriceFragment'
        new:
          $ref: '#/components/schemas/PriceFragment'
      required:
      - item
      - name
      - type
    CartLine:
      type: object
      properties:
        id:
          type: string
        menu_item:
          $ref: '#/components/schemas/CartMenuItemRef'
        variant_name:
          type: string
        quantity:
          type: integer
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/CartLineModifier'
        unit_price:
          $ref: '#/components/schemas/Money'
        line_subtotal:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
        special_instructions:
          type: string
        is_available:
          type: boolean
        unavailable_reason:
          type: string
      required:
      - discount
      - id
      - is_available
      - line_subtotal
      - menu_item
      - modifiers
      - quantity
      - special_instructions
      - unavailable_reason
      - unit_price
      - variant_name
      - vat
    CartLineModifier:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
        price_delta:
          $ref: '#/components/schemas/Money'
      required:
      - name
      - price_delta
      - quantity
    CartMenuItemRef:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
        image_url:
          type: string
          nullable: true
      required:
      - image_url
      - name
      - slug
    CartUnavailable:
      type: object
      properties:
        item:
          type: string
        name:
          type: string
        reason:
          type: string
      required:
      - item
      - name
      - reason
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        emoji:
          type: string
          description: Shown beside the category name.
          maxLength: 8
        description:
          type: string
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        item_count:
          type: integer
          readOnly: true
      required:
      - id
      - item_count
      - name
      - slug
    CateringPackage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        min_guests:
          type: integer
          readOnly: true
        max_guests:
          type: integer
          readOnly: true
        price_per_person:
          type: object
          nullable: true
          required:
          - amount
          - currency
          - display
          properties:
            amount:
              type: integer
              description: Integer kobo. ₦1.00 = 100. Render `display`; never do arithmetic
                on this.
            currency:
              type: string
              example: NGN
            display:
              type: string
              example: ₦12,500.00
          readOnly: true
        features:
          readOnly: true
        is_popular:
          type: boolean
          readOnly: true
      required:
      - description
      - features
      - id
      - is_popular
      - max_guests
      - min_guests
      - name
      - price_per_person
      - slug
    ContactAcknowledgement:
      type: object
      properties:
        reference:
          type: string
        detail:
          type: string
      required:
      - detail
      - reference
    ContactReasonEnum:
      enum:
      - general
      - reservation
      - catering
      - feedback
      - partnership
      type: string
      description: |-
        * `general` - general
        * `reservation` - reservation
        * `catering` - catering
        * `feedback` - feedback
        * `partnership` - partnership
    ContactRequest:
      type: object
      description: Mirrors the fields the contact form already collects.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          default: ''
          maxLength: 20
        reason:
          allOf:
          - $ref: '#/components/schemas/ContactReasonEnum'
          default: general
        subject:
          type: string
          default: ''
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
        website:
          type: string
          default: ''
      required:
      - email
      - message
      - name
    CreateEnquiryRequest:
      type: object
      description: |-
        Exactly the fields the existing form collects.

        Note what is absent: any price. The indicative total is computed server-side
        from the package and the guest count.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          maxLength: 20
        guest_count:
          type: integer
          maximum: 5000
          minimum: 1
        package:
          type: string
          default: ''
          pattern: ^[-a-zA-Z0-9_]+$
