openapi: 3.0.3
info:
  title: Kuyash Place Restaurant API
  version: 1.0.0
  description: |-
    Backend API for Kuyash Place Restaurant.

    **All money values are integer kobo** wrapped in a `{amount, currency, display}` object. Clients render `display` and never perform arithmetic on `amount`.
paths:
  /api/v1/core/branch/:
    get:
      operationId: core_branch_retrieve
      description: Branch details, VAT policy and whether ordering is currently possible.
      summary: Branch details
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/core/opening-hours/:
    get:
      operationId: core_opening_hours_retrieve
      description: The weekly schedule plus any upcoming holiday overrides.
      summary: Opening hours
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHoursResponse'
          description: ''
  /api/v1/core/settings/:
    get:
      operationId: core_settings_retrieve
      description: Social links, homepage statistics and site copy.
      summary: Site settings
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
  /api/v1/core/legal/:
    get:
      operationId: core_legal_list
      description: |-
        Which policy pages exist.

        Replaces a hardcoded array of footer links that could point at a page whose
        wording had since changed or been withdrawn.
      summary: Legal pages
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalPageSummary'
          description: ''
  /api/v1/core/legal/{slug}/:
    get:
      operationId: core_legal_retrieve
      description: |-
        One policy page, at the version in force today.

        A future-dated version is a scheduled change and is not served; an
        unpublished one is a draft and is not served either.
      summary: A legal page
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - core
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalPage'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Seeds the CSRF cookie.

        The frontend calls this once on load, then echoes the cookie value in an
        ``X-CSRFToken`` header on every unsafe request.
      summary: Seed the CSRF cookie
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      description: 'Returns the current user, or ``{"user": null}`` when anonymous.'
      summary: Current session
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account and send a verification email.
      summary: Register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Establish a session.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Destroy the session.
      summary: Log out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Confirm an email address and sign the user in.
      summary: Verify email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: |-
        Re-send the verification email.

        Responds identically whether or not the account exists (AS-3).
      summary: Resend verification email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Start a password reset. Always reports success (AS-3).
      summary: Request a password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailOnlyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Complete a password reset.
      summary: Confirm a password reset
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change a password while signed in.
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: Menu categories with orderable-item counts.
      summary: List menu categories
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/dietary-tags/:
    get:
      operationId: catalog_dietary_tags_list
      description: The dietary filter vocabulary.
      summary: List dietary tags
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DietaryTag'
          description: ''
  /api/v1/catalog/featured/:
    get:
      operationId: catalog_featured_list
      description: What's Hot.
      summary: Featured items
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemList'
          description: ''
  /api/v1/catalog/items/:
    get:
      operationId: catalog_items_list
      description: |-
        The menu, filtered and sorted server-side.

        Items with unconfirmed placeholder prices are excluded entirely.
      summary: List menu items
      parameters:
      - in: query
        name: available_only
        schema:
          type: boolean
        description: Honour 86'd items and windows.
      - in: query
        name: category
        schema:
          type: string
        description: Category slug.
      - in: query
        name: dietary
        schema:
          type: string
        description: Comma-separated tag slugs. AND semantics.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: max_price
        schema:
          type: integer
        description: Maximum price in kobo.
      - in: query
        name: min_price
        schema:
          type: integer
        description: Minimum price in kobo.
      - in: query
        name: min_rating
        schema:
          type: string
        description: Minimum average rating, 0–5.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches name and description.
      - in: query
        name: sort
        schema:
          type: string
        description: popular | price_asc | price_desc | rating | newest
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMenuItemListList'
          description: ''
  /api/v1/catalog/items/{slug}/:
    get:
      operationId: catalog_items_retrieve
      description: One dish, with its variants and per-item modifier groups.
      summary: Retrieve a menu item
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDetail'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      description: The current cart, repriced on every read.
      summary: Get the current cart
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Anonymous cart identifier.
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      description: The current cart, repriced on every read.
      summary: Empty the cart
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: cart_items_create
      description: Add a configured line.
      summary: Add an item to the cart
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      description: Change or remove one line.
      summary: Update a cart line
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Change or remove one line.
      summary: Remove a cart line
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/promo/:
    post:
      operationId: cart_promo_create
      description: Apply or remove a promo code.
      summary: Apply a promo code
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PromoRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_promo_destroy
      description: Apply or remove a promo code.
      summary: Remove the promo code
      tags:
      - cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/fulfilment/:
    patch:
      operationId: cart_fulfilment_partial_update
      description: Set delivery or pickup, the address and the tip.
      summary: Set fulfilment options
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFulfilmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFulfilmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFulfilmentRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/merge/:
    post:
      operationId: cart_merge_create
      description: Fold an anonymous cart into the signed-in one after login.
      summary: Merge a guest cart
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Token of the guest cart to merge in.
      tags:
      - cart
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/quote/:
    post:
      operationId: cart_quote_create
      description: |-
        Price a configured dish without adding it to a cart.

        The item dialog shows a live total while options are chosen. Computing that
        in the browser would duplicate — and eventually contradict — the pricing
        rules, so the dialog asks here, and gets the figure the cart will charge.
      summary: Quote a configured item
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemQuoteInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ItemQuoteInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemQuoteInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemQuote'
          description: ''
  /api/v1/orders/:
    post:
      operationId: orders_create
      description: Place an order, or list the caller's own.
      summary: Place an order
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: A UUID. Replaying it returns the original response.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/mine/:
    get:
      operationId: orders_mine_list
      description: The caller's order history.
      summary: List my orders
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
  /api/v1/orders/{reference}/:
    get:
      operationId: orders_retrieve
      description: One order. The polling target.
      summary: Retrieve an order
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: Send the previous ETag to receive 304 when unchanged.
      - in: header
        name: X-Guest-Token
        schema:
          type: string
        description: Required for guest orders.
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{reference}/cancel/:
    post:
      operationId: orders_cancel_create
      description: Customer-initiated cancellation.
      summary: Cancel an order
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{reference}/reorder/:
    post:
      operationId: orders_reorder_create
      description: Rebuild the basket from a past order, at today's prices.
      summary: Reorder a past order
      parameters:
      - in: header
        name: X-Cart-Token
        schema:
          type: string
        description: Anonymous cart token, if the caller has one.
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderResponse'
          description: ''
  /api/v1/orders/{reference}/receipt/:
    get:
      operationId: orders_receipt_retrieve
      description: A PDF receipt for a paid order.
      summary: Download a receipt
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/kds/orders/:
    get:
      operationId: kds_orders_retrieve
      description: The live ticket queue, oldest first.
      summary: Kitchen queue
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses.
      tags:
      - kds
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KDSQueue'
          description: ''
  /api/v1/kds/summary/:
    get:
      operationId: kds_summary_retrieve
      description: Counts and today's revenue.
      summary: Kitchen summary
      tags:
      - kds
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KDSSummary'
          description: ''
  /api/v1/kds/orders/{reference}/assign-rider/:
    post:
      operationId: kds_orders_assign_rider_create
      description: Assign a rider to a ready order.
      summary: Assign a rider
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - kds
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
