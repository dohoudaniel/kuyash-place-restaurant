    PatchedAddressRequest:
      type: object
      description: |-
        A saved address, with its resolved delivery zone.

        ``zone: null`` means the address falls outside the delivery area — the UI
        must offer pickup rather than letting the customer fail at checkout.
      properties:
        label:
          $ref: '#/components/schemas/LabelEnum'
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          pattern: ^\+?[1-9]\d{7,14}$
          maxLength: 20
        street:
          type: string
          minLength: 1
          maxLength: 255
        area:
          type: string
          description: District or neighbourhood, e.g. Victoria Island. Used to resolve
            the zone.
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        landmark:
          type: string
          maxLength: 255
        delivery_notes:
          type: string
        is_default:
          type: boolean
    PatchedFulfilmentRequest:
      type: object
      properties:
        fulfilment_type:
          $ref: '#/components/schemas/FulfilmentTypeEnum'
        delivery_address:
          type: string
          format: uuid
          nullable: true
        tip:
          type: integer
          minimum: 0
          description: Gratuity in kobo.
    PatchedProfileRequest:
      type: object
      description: |-
        Read/write profile.

        ``email`` is deliberately read-only. Changing it must re-verify the new
        address and notify the old one (AS-5); until that flow exists in Phase 2,
        the safe behaviour is to refuse the change rather than allow an unverified one.
      properties:
        full_name:
          type: string
          description: The UI collects a single name field, not first/last. Optional
            at the model level because social sign-in may not supply one; the signup
            serializer requires it.
          maxLength: 150
        phone:
          type: string
          description: International format. Required before placing a delivery order.
          pattern: ^\+?[1-9]\d{7,14}$
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        marketing_opt_in:
          type: boolean
    PatchedRescheduleRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        party_size:
          type: integer
          maximum: 50
          minimum: 1
    PatchedReviewInputRequest:
      type: object
